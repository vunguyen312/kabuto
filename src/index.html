<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Kabuto Editor</title>
  </head>
  <body>
    <nav id="titlebar">
      <img id="logo" src="<%= require('./assets/logo.png') %>" alt="Kabuto Editor Logo" />
      <ul id="nav-buttons">
        <li>
          <button class="nav-button" id="file">File</button>
        </li>
        <li>
          <button class="nav-button" id="edit">Edit</button>
        </li>
        <li>
          <button class="nav-button" id="selection">Selection</button>
        </li>
        <li>
          <button class="nav-button" id="view">View</button>
        </li>
        <li>
          <button class="nav-button" id="terminal">Terminal</button>
        </li>
        <li>
          <button class="nav-button" id="help">Help</button>
        </li>
      </ul>
    </nav>
    <div id="editor">
      <div id="line-numbers" disabled="true"></div>
      <div id="output"></div>
      <textarea 
        id="text-input" 
        autocomplete="false" 
        autocapitalize="false" 
        spellcheck="false"
      ></textarea>
    </div>
    <div id="stats">
      <span id="char">0 characters,</span>
      <span id="totalLn">1 lines</span>
      <div id="right-stats">
        <span id="ln">Ln: 1,</span>
        <span id="col">Col: 1</span>
      </div>
    </div>
  </body>
</html>
